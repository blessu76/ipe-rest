<!DOCTYPE html>
<!-- TEMPLATE — copy to journal/YYYY-MM-DD-slug/index.html and replace every {{PLACEHOLDER}}. See journal/README.md. -->
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE_EN}} — ipe() journal</title>
<meta name="ipe:title-en" content="{{TITLE_EN}} — ipe() journal">
<meta name="ipe:title-ko" content="{{TITLE_KO}} — ipe() 저널">
<meta name="description" content="{{DESCRIPTION_EN}}">
<meta name="author" content="ipe()">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#fbfaf4">
<link rel="canonical" href="https://ipe.rest/journal/{{DATE}}-{{SLUG}}/">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="preload" href="/fonts/lora-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin>

<meta property="og:type" content="article">
<meta property="og:site_name" content="ipe()">
<meta property="og:title" content="{{TITLE_EN}}">
<meta property="og:description" content="{{DESCRIPTION_EN}}">
<meta property="og:url" content="https://ipe.rest/journal/{{DATE}}-{{SLUG}}/">
<meta property="og:image" content="https://ipe.rest/og-image.png">
<meta property="og:locale" content="en_US">
<meta property="og:locale:alternate" content="ko_KR">
<meta property="article:published_time" content="{{DATE}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{TITLE_EN}}">
<meta name="twitter:description" content="{{DESCRIPTION_EN}}">
<meta name="twitter:image" content="https://ipe.rest/og-image.png">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": "{{TITLE_EN}}",
  "alternativeHeadline": "{{TITLE_KO}}",
  "description": "{{DESCRIPTION_EN}}",
  "datePublished": "{{DATE}}",
  "dateModified": "{{DATE}}",
  "inLanguage": ["en", "ko"],
  "image": "https://ipe.rest/og-image.png",
  "url": "https://ipe.rest/journal/{{DATE}}-{{SLUG}}/",
  "mainEntityOfPage": "https://ipe.rest/journal/{{DATE}}-{{SLUG}}/",
  "author": { "@type": "Organization", "name": "ipe()", "url": "https://ipe.rest/" },
  "publisher": { "@type": "Organization", "name": "ipe()", "url": "https://ipe.rest/", "logo": { "@type": "ImageObject", "url": "https://ipe.rest/icon-512.png" } },
  "isPartOf": { "@type": "Blog", "name": "ipe() journal", "url": "https://ipe.rest/journal/" }
}
</script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    { "@type": "ListItem", "position": 1, "name": "ipe()", "item": "https://ipe.rest/" },
    { "@type": "ListItem", "position": 2, "name": "journal", "item": "https://ipe.rest/journal/" },
    { "@type": "ListItem", "position": 3, "name": "{{TITLE_EN}}" }
  ]
}
</script>
<link rel="stylesheet" href="/journal/journal.css?v=1">
</head>
<body>
<header class="topbar">
  <a class="logo" href="/" aria-label="ipe home">ipe<span>()</span></a>
  <div class="top-right">
    <nav aria-label="Primary"><a href="/">home</a><a href="/journal/" aria-current="page">journal</a></nav>
    <div class="langswitch" role="group" aria-label="Language / 언어">
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="ko" aria-pressed="false">KO</button>
    </div>
  </div>
</header>

<main>
<article class="wrap">
  <header class="post-head">
    <p class="eyebrow"><i></i><span>journal · <time datetime="{{DATE}}">{{DATE}}</time></span></p>
    <h1 lang="en">{{TITLE_EN}}</h1>
    <h1 lang="ko">{{TITLE_KO}}</h1>
  </header>

  <div class="prose" lang="en">
    <p class="lead">{{LEAD_EN}}</p>
    <p>{{PARAGRAPH_EN}}</p>
    <!-- optional: <blockquote>…</blockquote> -->
  </div>

  <div class="prose" lang="ko">
    <p class="lead">{{LEAD_KO}}</p>
    <p>{{PARAGRAPH_KO}}</p>
  </div>

  <a class="back" href="/journal/"><span lang="en">← all entries</span><span lang="ko">← 전체 글</span></a>
</article>
</main>

<footer>
  <p class="sig">ipe<span>()</span></p>
  <div class="foot">
    <p>© 2026 ipe() · idle · still · draft · pawstcard</p>
    <p><a href="/">ipe.rest</a> · <a href="/journal/">journal</a></p>
  </div>
</footer>
<script src="/journal/journal.js?v=1" defer></script>
</body>
</html>
